# Keep the Render free backend instance awake.
#
# Render free instances spin down after ~15 min with no traffic, and the first
# request then waits ~30 s for a cold start. Pinging /health every 10 min keeps
# the instance warm so the dashboard loads instantly during the demo.
#
# Manual wake-up: Actions -> Keep backend awake -> Run workflow.
# Pause without deleting: set repo variable KEEPALIVE=off
#   (Settings -> Secrets and variables -> Actions -> Variables).
# Note: an always-on free instance consumes your monthly free instance hours,
# so disable this after the demo.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.KEEPALIVE != 'off' }}
    steps:
      - name: Ping Render health endpoint
        env:
          BACKEND_URL: https://shadowflow-api.onrender.com
        run: |
          echo "Pinging ${BACKEND_URL}/health"
          # --retry covers the cold-start window (first request can take ~30 s).
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --max-time 120 --retry 2 --retry-delay 15 --retry-all-errors \
            "${BACKEND_URL}/health") || true
          echo "HTTP ${code}"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Backend did not answer 200 (got '${code}') - check the Render service."
            exit 1
          fi
          echo "Backend is awake."
